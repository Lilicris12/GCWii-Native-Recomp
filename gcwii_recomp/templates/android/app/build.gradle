// Android packaging for the natively recompiled program.
// Open the parent "android" folder in Android Studio, or run `gradle assembleRelease`.
plugins { id 'com.android.application' }

android {
    namespace '@PACKAGE@'
    compileSdk 34
    ndkVersion '26.3.11579264'
    defaultConfig {
        applicationId '@PACKAGE@'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild {
            cmake { arguments '-DGCRT_PLATFORM=android', '-DANDROID_STL=none' }
        }
    }
    externalNativeBuild {
        cmake { path file('../../CMakeLists.txt'); version '3.22.1' }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
}
